server.port=8080

# --- Database (DB_PASSWORD defaults to empty, which only suits a local MySQL without a root password) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# "update" is fine for local development. Use "validate" plus migrations (Flyway/Liquibase) in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Do not leak internal error details to clients ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# We use JWT, not Spring's generated default user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- JWT ---
# At least 32 characters. If empty, a random secret is generated on every start (logins reset on restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# --- CORS (comma-separated origin patterns) ---
app.cors.allowed-origin-patterns=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.replit.dev,https://*.repl.co}

# --- Optional first admin account, created at startup if the email is not registered yet ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}

# --- Sign-in throttling: after this many wrong passwords from one address for one email, block for the lockout time ---
app.security.max-login-failures=${MAX_LOGIN_FAILURES:5}
app.security.lockout-minutes=${LOCKOUT_MINUTES:15}
